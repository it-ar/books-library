<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مكتبة هيئة حقوق الإنسان — البحث والتصفّح</title>
  <meta name="description" content="لوحة معلومات وبحث في كتب مكتبة هيئة حقوق الإنسان" />
  <link rel="stylesheet" href="assets/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>" />
</head>
<body>
  <a class="skip-link" href="#results">تخطٍّ إلى النتائج</a>

  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 100 100" width="46" height="46" role="img" aria-label="شعار هيئة حقوق الإنسان">
            <path d="M 83.53 65.64 A 37 37 0 0 1 17.96 68.50" fill="none" stroke="var(--brand-dark)" stroke-width="11" stroke-linecap="round"/>
            <path d="M 16.47 34.36 A 37 37 0 0 1 82.04 31.50" fill="none" stroke="var(--brand-dark)" stroke-width="11" stroke-linecap="round"/>
            <rect x="31" y="30" width="38" height="10" rx="2" fill="var(--brand-dark)"/>
            <rect x="44.5" y="30" width="11" height="38" rx="1.5" fill="var(--brand-dark)"/>
            <path d="M 38 60 L 50 71 L 62 60" fill="none" stroke="var(--brand-light)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <div class="brand-text">
          <h1>مكتبة هيئة حقوق الإنسان</h1>
          <p id="subtitle">جارٍ تحميل البيانات…</p>
        </div>
      </div>

      <div class="search-wrap">
        <svg class="search-icon" aria-hidden="true" viewBox="0 0 24 24" width="20" height="20">
          <path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5Zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14Z"/>
        </svg>
        <input id="search" type="search" inputmode="search" autocomplete="off"
               placeholder="ابحث باسم الكتاب أو المؤلف…" aria-label="بحث" />
        <button id="clear-search" class="clear-btn" type="button" aria-label="مسح البحث" hidden>&times;</button>
      </div>
    </div>
  </header>

  <main>
    <!-- لوحة المعلومات -->
    <section class="dashboard" aria-label="لوحة المعلومات">
      <div class="dash-inner">
        <div class="stats" id="stats"></div>
        <div class="top-authors" id="top-authors">
          <h2 class="panel-title"><span aria-hidden="true">🏆</span> أكثر المؤلفين إنتاجًا</h2>
          <ol class="top-authors-list" id="top-authors-list"></ol>
        </div>
      </div>
    </section>

    <section class="controls" aria-label="أدوات التصفية">
      <div class="controls-inner">
        <div class="chips" id="category-chips" role="tablist" aria-label="التصنيفات"></div>
      </div>
      <div class="controls-row">
        <div class="author-filter" id="author-filter">
          <label for="author-search" class="af-label">فلترة بالمؤلف:</label>
          <div class="af-box">
            <input id="author-search" type="text" autocomplete="off" placeholder="اكتب اسم المؤلف…"
                   aria-label="فلترة بالمؤلف" role="combobox" aria-expanded="false" aria-controls="author-list" />
            <button id="author-clear" class="af-clear" type="button" aria-label="إلغاء فلتر المؤلف" hidden>&times;</button>
            <ul id="author-list" class="af-list" role="listbox" hidden></ul>
          </div>
        </div>
        <label class="sort-field">
          <span>ترتيب:</span>
          <select id="sort" aria-label="ترتيب النتائج">
            <option value="title">حسب الاسم (أ-ي)</option>
            <option value="author">حسب المؤلف</option>
            <option value="copies">حسب عدد النسخ</option>
            <option value="category">حسب التصنيف</option>
          </select>
        </label>
      </div>
      <p class="result-count" id="result-count" aria-live="polite"></p>
    </section>

    <section id="results" class="results" tabindex="-1" aria-label="قائمة الكتب"></section>

    <div id="empty-state" class="empty-state" hidden>
      <span aria-hidden="true">🔍</span>
      <p>لا توجد كتب مطابقة</p>
      <button id="reset-all" type="button" class="btn">إعادة التعيين</button>
    </div>

    <div id="sentinel" class="sentinel" aria-hidden="true"></div>
    <p id="load-status" class="load-status" aria-live="polite"></p>
  </main>

  <footer class="site-footer">
    <p>مكتبة هيئة حقوق الإنسان · <span id="footer-count"></span></p>
  </footer>

  <!-- نافذة تفاصيل الكتاب -->
  <dialog id="book-dialog" class="book-dialog">
    <form method="dialog">
      <button class="dialog-close" value="close" aria-label="إغلاق">&times;</button>
    </form>
    <div id="dialog-body"></div>
  </dialog>

  <script src="assets/books-data.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
