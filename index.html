<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>قائمة الكتب — هيئة حقوق الإنسان</title>
  <meta name="description" content="الفهرس الإلكتروني: بحث وتصفّح قائمة كتب هيئة حقوق الإنسان" />
  <link rel="stylesheet" href="assets/fonts.css" />
  <link rel="stylesheet" href="assets/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>" />
</head>
<body>
  <a class="skip-link" href="#results">تخطٍّ إلى النتائج</a>

  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <img class="brand-logo-img" src="assets/logo-hrc.svg" alt="شعار هيئة حقوق الإنسان" width="150" height="46" />
        <span class="brand-divider" aria-hidden="true"></span>
        <div class="brand-text">
          <h1>قائمة الكتب</h1>
          <p id="subtitle">الفهرس الإلكتروني</p>
        </div>
      </div>

      <div class="search-wrap">
        <svg class="search-icon" aria-hidden="true" viewBox="0 0 24 24" width="20" height="20">
          <path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5Zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14Z"/>
        </svg>
        <input id="search" type="search" inputmode="search" autocomplete="off"
               placeholder="ابحث باسم الكتاب أو المؤلف…" aria-label="بحث" />
        <button id="clear-search" class="clear-btn" type="button" aria-label="مسح البحث" hidden>&times;</button>
      </div>
    </div>
  </header>

  <main>
    <!-- لوحة المعلومات -->
    <section class="dashboard" aria-label="لوحة المعلومات">
      <div class="stats" id="stats"></div>

      <div class="dash-grid">
        <section class="panel top-authors" id="top-authors" aria-label="أكثر المؤلفين">
          <div class="panel-head">
            <span class="eyebrow">المؤلفون</span>
            <h2 class="panel-title">أكثر المؤلفين إنتاجًا</h2>
          </div>
          <ol class="top-authors-list" id="top-authors-list"></ol>
        </section>

        <section class="panel hay-dash" aria-label="إصدارات الهيئة حسب النوع">
          <div class="panel-head hay-head">
            <div>
              <span class="eyebrow">إصدارات الهيئة</span>
              <h2 class="panel-title">التوزيع حسب النوع</h2>
            </div>
            <p class="hay-sub" id="hay-sub"></p>
          </div>
          <div class="hay-types" id="hay-types"></div>
        </section>
      </div>
    </section>

    <section class="controls" aria-label="أدوات التصفية">
      <div class="section-label"><span class="eyebrow">التصنيفات</span></div>
      <div class="chips" id="category-chips" role="tablist" aria-label="التصنيفات"></div>

      <div class="controls-row">
        <div class="author-filter" id="author-filter">
          <label for="author-search" class="af-label">فلترة بالمؤلف</label>
          <div class="af-box">
            <input id="author-search" type="text" autocomplete="off" placeholder="اكتب اسم المؤلف…"
                   aria-label="فلترة بالمؤلف" role="combobox" aria-expanded="false" aria-controls="author-list" />
            <button id="author-clear" class="af-clear" type="button" aria-label="إلغاء فلتر المؤلف" hidden>&times;</button>
            <ul id="author-list" class="af-list" role="listbox" hidden></ul>
          </div>
        </div>
        <label class="sort-field">
          <span>ترتيب حسب</span>
          <select id="sort" aria-label="ترتيب النتائج">
            <option value="title">الاسم (أ-ي)</option>
            <option value="author">المؤلف</option>
            <option value="copies">عدد النسخ</option>
            <option value="category">التصنيف</option>
          </select>
        </label>
      </div>
      <p class="result-count" id="result-count" aria-live="polite"></p>
    </section>

    <section id="results" class="results" tabindex="-1" aria-label="قائمة الكتب"></section>

    <div id="empty-state" class="empty-state" hidden>
      <span aria-hidden="true">🔍</span>
      <p>لا توجد كتب مطابقة</p>
      <button id="reset-all" type="button" class="btn">إعادة التعيين</button>
    </div>

    <div id="sentinel" class="sentinel" aria-hidden="true"></div>
    <p id="load-status" class="load-status" aria-live="polite"></p>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p>قائمة كتب هيئة حقوق الإنسان · <span id="footer-count"></span></p>
    </div>
  </footer>

  <!-- نافذة تفاصيل الكتاب -->
  <dialog id="book-dialog" class="book-dialog">
    <form method="dialog">
      <button class="dialog-close" value="close" aria-label="إغلاق">&times;</button>
    </form>
    <div id="dialog-body"></div>
  </dialog>

  <script src="assets/books-data.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
